name: Portable checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install pinned Rust components
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
      - name: Install locked Python dependencies
        run: python -m pip install --no-deps --require-hashes -r requirements-dev.lock
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run the shared portable checks
        run: python scripts/check.py
