[package]
name = "scan-cache"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "scan-cache"
path = "src/main.rs"

[dependencies]
anyhow = "1"
e57 = "0.11.13"
las = { version = "0.11.1", features = ["laz"] }
laz = "0.13.0"
memmap2 = "0.9"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
